<script type="application/json" id="data">{"name":"mogesjohnson/BEST-OF-AI-DEV","total":117,"steps":[{"file":"README.md","category":"overview","language":"Markdown","caption":"Start here: the README introduces **BEST OF AI DEV**. Moges Johnson's template and source of truth for AI-first development: the practices worth keeping, drop-in agent rules for every new repo, and a docs site on why each practice matters. Sections include `What's here`, `Use it`, `Run the docs site`, `Known gaps` and 1 more.","code":"# BEST OF AI DEV\n\nMoges Johnson's template and source of truth for AI-first development: the practices worth\nkeeping, drop-in agent rules for every new repo, and a docs site on why each practice matters.\n\n**Docs site: https://mogesjohnson.github.io/BEST-OF-AI-DEV/** (built from [`site/`](site), deployed\nto GitHub Pages on every push to `main`).\n\nMost of this repo was written by a coding agent through small, self-reviewed pull requests,\nunder the rules it ships. The repo holds itself to the same template it offers, and the gaps\nare listed below instead of hidden.\n\n## What's here\n\n| Path | What it is |\n| --- | --- |\n| [`template/`](template) | Files to drop into a new repo: `AGENTS.md`, `RULES.md`, vendor imports, hooks, checks, workflows and agent configs. Repo-specific parts are marked `\u003c!-- REPO-SPECIFIC -->`. |\n| [`practices/`](practices) | A review of my own repos: [what to keep](practices/keep.md) and [what to change](practices/change.md). |\n| [`docs/why/`](docs/why/index.md) | Eleven pages on why each practice exists, each with sources. |\n| [`docs/migrations/`](docs/migrations) | A plan for moving each of my repos onto the template. |\n| [`docs/decisions/`](docs/decisions) | Decision records for this repo, such as zero-install hooks and lines-not-commits for size. |\n| [`site/`](site) | A static Next.js site that renders `docs/why/`, styled after shadow-docs. Live at https://mogesjohnson.github.io/BEST-OF-AI-DEV/. |\n\nThis repo follows its own [`AGENTS.md`](AGENTS.md) and [`RULES.md`](RULES.md), which are the\ntemplate's copies with this repo's slots filled in.\n\n## Use it\n\nStart a new repo from `template/`, or move an existing one with the\n[shared migration steps](docs/migrations/README.md). Then fill the `REPO-SPECIFIC` slots.\n\nOn Windows (PowerShell 5.1, Node 20.9 or newer, which the site also needs), check the hooks and checks from a fresh clone:\n\n```powershell\ngh repo clone mogesjohnson/BEST-OF-AI-DEV\ncd BEST-OF-AI-DEV\nnpm install\npowershell -ExecutionPolicy Bypass -File .\\template\\scripts\\test-windows.ps1\n```\n\n`npm install` runs `prepare`, which points `core.hooksPath` at the repo's hooks. It needs only git\nand Node (`gh` is just for the clone). Lefthook and gitleaks are optional extras.\n\n## Run the docs site\n\n```powershell\ncd site\nnpm ci\nnpm run dev\n```\n\nOpen http://localhost:3000. See [`site/README.md`](site/README.md) for the build and for\nhosting under a subpath. The site isn't deployed yet.\n\n## Known gaps\n\n- **Self-merge.** R6 says writers don't merge their own PRs, but every PR here was opened and\n  merged by the same account. From #25 on, each merge waited for green checks. #16, #22, #23\n  and #24 were merged before theirs had passed. #8 to #11 were merged with red checks while\n  GitHub Actions billing was failing every run, so their checks never really ran. A ruleset requiring\n  review would fix this. That's the owner's call, and none is set up yet.\n- **Checks are advisory** until a ruleset marks `pr-checks` as required.\n- **Not run here:** gitleaks, lefthook and actionlint, a live agent session against the\n  configs, and the checker-change path (its `checker-change` and `size-exception` labels\n  don't exist yet).\n- [ADR 0004](docs/decisions/0004-commit-and-branch-names.md) on commit and branch names is\n  still proposed.\n\n## About me\n\nI'm Moges Johnson ([@mogesjohnson](https://github.com/mogesjohnson), on GitHub since December\n2023). From my [portfolio](https://github.com/mogesjohnson/Personal-Portfolio), self-reported:\n\n- Computer Science student at Liberty University: BS in Computer Science, Software Engineering\n  concentration, minor in Business, expected Spring 2028.\n- Handshake AI Fellow since August 2026.\n- Software Engineer Intern at NonProfitly, Inc., summer 2026.\n\nPublic projects:\n\n- [shadow-army](https://github.com/mogesjohnson/shadow-army): a CLI that commands other AI CLIs\n  with isolated context, and its docs site, [shadow-docs](https://github.com/mogesjohnson/shadow-docs).\n- [trace-workbench](https://github.com/mogesjohnson/trace-workbench): shared Windows computer\n  tools for AI agents, in early development.\n- [post-it-board](https://github.com/mogesjohnson/post-it-board) and\n  [how-to-post-it](https://github.com/mogesjohnson/how-to-post-it): a corkboard of daily notes,\n  and how notes reach it.\n- C++ data structures: [Binary_Search_Tree](https://github.com/mogesjohnson/Binary_Search_Tree),\n  [LRU_Buffer_Pool](https://github.com/mogesjohnson/LRU_Buffer_Pool) and\n  [Self_Organizing_Lists](https://github.com/mogesjohnson/Self_Organizing_Lists).\n\n\u003c!-- TODO(verify): Moges to confirm the bullets above and add anything the portfolio leaves out. -->\n\nNo license has been chosen yet, so all rights are reserved for now. \u003c!-- TODO(verify): owner to pick a license. -->\n"},{"file":"AGENTS.md","category":"agent","language":"Markdown","caption":"Instructions for AI coding agents working in this repo. BEST-OF-AI-DEV is Moges Johnson's template repo for AI-first development: drop-in agent rules and checks in template/, the reasoning in practices/, and a docs site in site/. It follows its own template. Sections include `What this repo is`, `Commands`, `Where things live`, `How work flows` and 3 more.","code":"# AGENTS.md\n\n\u003c!-- BEST-OF-AI-DEV template v1. Canonical rules for every agent and human in this repo.\n     CLAUDE.md, GEMINI.md and any other vendor file point here and add nothing else.\n     Keep this file at or under 70 lines. Long detail goes in RULES.md or docs/. -->\n\n## What this repo is\n\n\u003c!-- REPO-SPECIFIC: one or two sentences. What it does, who uses it, current version. -->\nBEST-OF-AI-DEV is Moges Johnson's template repo for AI-first development: drop-in agent rules\nand checks in `template/`, the reasoning in `practices/`, and a docs site in `site/`. It follows its own template.\n\u003c!-- /REPO-SPECIFIC -->\n\n## Commands\n\nRun these from the repo root. They are the only definition of \"checks pass\".\n\n\u003c!-- REPO-SPECIFIC: replace with the real commands. Delete any that do not exist. -->\n- Install hooks once per clone: `npm install` (sets `core.hooksPath`; no dependencies).\n  pre-commit scans for secrets; pre-push runs `npm test` and the size gate.\n- Test scripts, hooks and template sync: `npm test` (Node 20+). PR size: `npm run check:size`\n\u003c!-- /REPO-SPECIFIC -->\n\n## Where things live\n\n\u003c!-- REPO-SPECIFIC: five to ten lines. Path, then what it holds. No full tree. -->\n- `template/`: the files a new repo copies. Root files mirror them; `template-sync` checks that.\n- `practices/`: what to keep and what to change, each with its reason and source repo.\n- `template/scripts/`: the checks and hooks. This repo runs them in place; there is no root copy.\n- `docs/tasks/`, `docs/decisions/`: this repo's task specs and ADRs; `0000-template.md` is the blank form.\n\u003c!-- /REPO-SPECIFIC -->\n\n## How work flows\n\n1. Every change starts from a task spec (`docs/tasks/`) or an issue with acceptance criteria.\n2. One task, one branch, one worktree: `\u003cagent>/\u003cshort-topic>`, off fresh `main`.\n3. Small PRs. The size gate fails above 600 changed lines (lockfiles excluded); aim under 400.\n4. Conventional Commits: lowercase `type(scope): subject`, at most 72 characters. The hook checks it.\n   End each commit with `Refs: #N` (or the task file) and `Agent: \u003cname>` trailers (unchecked).\n5. The PR template is the report. Fill every section; untick what you did not check.\n6. The author never reviews or merges their own PR. See RULES.md R6.\n7. Merge only when `gh pr checks \u003cn> --watch --fail-fast` is green. See RULES.md R15.\n\n## Done means\n\n- Every acceptance criterion maps to a test or a recorded check.\n- Lint, types, tests and build pass locally, and the output was read, not assumed.\n- Each result is reported as `pass`, `fail`, `blocked` or `not_run`. Never round up.\n- Docs that describe the changed behavior are updated in the same PR.\n- Nothing is left running: no dev servers, watchers, MCP servers or stray worktrees.\n  On Windows, `scripts/cleanup-worktrees.ps1` and `scripts/mcp-doctor.ps1` list them (dry run).\n\n## Hard rules\n\nRead RULES.md before your first commit. The short version:\n\n- Never commit secrets, `.env*`, personal paths (`C:\\Users\\...`) or raw transcripts.\n- Never force-push, rewrite pushed history, or use `--no-verify`.\n- Never edit files outside this repo or outside your task's scope.\n- Ask before adding a dependency, changing CI, or touching auth, billing or data deletion.\n- When the spec and the code disagree, stop and say so. Do not guess.\n\n## Repo-specific rules\n\n\u003c!-- REPO-SPECIFIC: at most ten lines. Domain rules only this repo needs\n     (for example \"evidence receipts are sanitized\" or \"the reference site is read-only\").\n     Anything that applies to every repo belongs in BEST-OF-AI-DEV instead. -->\n- `template/` is the product. A change there must keep the root copy in sync in the same PR.\n- Cite a file or PR for claims about the owner's repos (else `TODO(verify)`); never edit them.\n\u003c!-- /REPO-SPECIFIC -->\n"},{"file":"CLAUDE.md","category":"agent","language":"Markdown","caption":"Instructions for AI coding agents working in this repo. It imports `AGENTS.md` instead of repeating its rules.","code":"@AGENTS.md\n\n\u003c!-- BEST-OF-AI-DEV template v1. Claude Code reads CLAUDE.md, not AGENTS.md, so this file\n     imports it. Add nothing here that other agents also need: put it in AGENTS.md.\n     Grok Build reads both files in the same directory, so a duplicate here is loaded twice. -->\n"},{"file":"GEMINI.md","category":"agent","language":"Markdown","caption":"Instructions for AI coding agents working in this repo. It imports `AGENTS.md` instead of repeating its rules.","code":"@AGENTS.md\n\n\u003c!-- BEST-OF-AI-DEV template v1. Gemini CLI reads GEMINI.md by default.\n     Antigravity reads AGENTS.md itself and treats the line above as a path reference.\n     This file imports AGENTS.md and must not grow its own rules.\n     Alternative: set \"contextFileName\": \"AGENTS.md\" in .gemini/settings.json and delete this file. -->\n"},{"file":".claude/settings.json","category":"agent","language":"JSON","caption":"JSON settings with top-level keys `$schema` and `permissions`.","code":"{\n  \"$schema\": \"https://json.schemastore.org/claude-code-settings.json\",\n  \"permissions\": {\n    \"allow\": [\n      \"Bash(npm test)\",\n      \"Bash(npm test *)\",\n      \"Bash(npm run lint)\",\n      \"Bash(npm run lint *)\",\n      \"Bash(npm run typecheck)\",\n      \"Bash(npm run build)\",\n      \"Bash(npm run check:size)\",\n      \"Bash(node scripts/check/*)\",\n      \"Bash(git status)\",\n      \"Bash(git status *)\",\n      \"Bash(git diff)\",\n      \"Bash(git diff *)\",\n      \"Bash(git log *)\",\n      \"Bash(git show *)\",\n      \"Bash(git branch --show-current)\",\n      \"Bash(git config --get *)\"\n    ],\n    \"ask\": [\n      \"Bash(git push *)\",\n      \"Bash(git worktree remove *)\",\n      \"Bash(npm install *)\",\n      \"Bash(npm i *)\",\n      \"Bash(npx *)\",\n      \"Bash(gh *)\",\n      \"Bash(curl *)\",\n      \"WebFetch\",\n      \"Edit(./.github/**)\",\n      \"Edit(./.githooks/**)\",\n      \"Edit(./scripts/**)\",\n      \"Edit(./package.json)\"\n    ],\n    \"deny\": [\n      \"Read(./.env)\",\n      \"Read(./.env.*)\",\n      \"Read(./**/.[eE][nN][vV])\",\n      \"Read(./**/.[eE][nN][vV].*)\",\n      \"Read(./**/*.[pP][eE][mM])\",\n      \"Read(./**/*.[kK][eE][yY])\",\n      \"Read(./**/*.[pP]12)\",\n      \"Read(./**/*.[pP][fF][xX])\",\n      \"Read(./**/[sS][eE][cC][rR][eE][tT][sS].[jJ][sS][oO][nN])\",\n      \"Read(./**/[iI][dD]_[rR][sS][aA])\",\n      \"Read(./**/[iI][dD]_[eE][dD]25519)\",\n      \"Read(./**/[iI][dD]_[eE][cC][dD][sS][aA])\",\n      \"Read(~/.ssh/**)\",\n      \"Bash(* --no-verify*)\",\n      \"Bash(git commit -n *)\",\n      \"Bash(git commit * -n *)\",\n      \"Bash(git commit * -n)\",\n      \"Bash(git push --force*)\",\n      \"Bash(git push * --force*)\",\n      \"Bash(git push -f *)\",\n      \"Bash(git push * -f *)\",\n      \"Bash(git push * -f)\",\n      \"Bash(git push * +*)\",\n      \"Bash(git reset --hard*)\",\n      \"Bash(git reset * --hard*)\",\n      \"Bash(git *core.hooksPath *)\",\n      \"Bash(git *core.hookspath *)\",\n      \"Bash(git *core.hooksPath=*)\",\n      \"Bash(git *core.hookspath=*)\",\n      \"Bash(git *--unset* *core.hooksPath*)\",\n      \"Bash(git *--unset* *core.hookspath*)\",\n      \"Bash(git *unset *core.hooksPath*)\",\n      \"Bash(git *unset *core.hookspath*)\",\n      \"Bash(git * --output*)\",\n      \"Bash(git * --ext-diff*)\",\n      \"Bash(git * --no-index*)\",\n      \"Bash(git show *.env*)\",\n      \"Bash(git show *.pem*)\",\n      \"Bash(git show *.key*)\",\n      \"Bash(git log *.env*)\",\n      \"Bash(git cat-file *.env*)\",\n      \"Bash(git cat-file *.pem*)\",\n      \"Bash(git cat-file *.key*)\",\n      \"Bash(git diff *.env)\",\n      \"Bash(git diff *.env *)\",\n      \"Bash(git diff *.env.local*)\",\n      \"Bash(git * > *)\",\n      \"Bash(git * >*)\",\n      \"Bash(git * 1>*)\",\n      \"Bash(git *&>*)\",\n      \"Bash(git *>>*)\",\n      \"Bash(git grep *sk-*)\",\n      \"Bash(git grep *AKIA*)\",\n      \"Bash(git grep *ghp_*)\",\n      \"Bash(git grep *github_pat_*)\",\n      \"Bash(git grep *xai-*)\",\n      \"Bash(git grep *xox*)\",\n      \"Bash(git grep *PRIVATE KEY*)\",\n      \"Bash(git grep *AIza*)\",\n      \"Bash(git grep *eyJ*)\",\n      \"Bash(git grep *api_key*)\",\n      \"Bash(git grep *API_KEY*)\",\n      \"Bash(git grep *--untracked*)\",\n      \"Bash(rm -rf *)\",\n      \"Bash(rm -fr *)\"\n    ]\n  }\n}\n"},{"file":".codex/config.toml","category":"agent","language":"TOML","caption":"Instructions for AI coding agents working in this repo (TOML, 25 lines). BEST-OF-AI-DEV template v1. Project config for Codex. Codex reads this file only after you trust the project; until then your user config applies. It cannot set providers, profiles, notify or telemetry: those stay in…","code":"# BEST-OF-AI-DEV template v1. Project config for Codex.\n# Codex reads this file only after you trust the project; until then your user config applies.\n# It cannot set providers, profiles, notify or telemetry: those stay in ~/.codex/config.toml.\n\n# Ask before leaving the sandbox. \"never\" is for CI or `codex exec` in a throwaway container.\napproval_policy = \"on-request\"\n\n# Write inside the repo only. danger-full-access is never a project default.\nsandbox_mode = \"workspace-write\"\n\n# Web search reads a cached index, not the live web. Prompt injection rides in on live pages.\nweb_search = \"cached\"\n\n[sandbox_workspace_write]\n# No outbound network from commands. Turn on per session (`-c`) when a task needs npm install.\nnetwork_access = false\n\n[shell_environment_policy]\n# Default is true, which passes variables named *KEY*, *SECRET* or *TOKEN* through to every\n# command the agent runs. false strips them.\nignore_default_excludes = false\n\n# REPO-SPECIFIC: extra writable roots or MCP servers this repo needs. Keep secrets out of here.\n# /REPO-SPECIFIC\n"},{"file":"package.json","category":"config","language":"JSON","caption":"Defines the `best-of-ai-dev` package: Moges Johnson's template and source of truth for AI-first development. Scripts: `prepare`, `test`, `check:size` and `test:windows`. It has no dependencies.","code":"{\n  \"name\": \"best-of-ai-dev\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"description\": \"Moges Johnson's template and source of truth for AI-first development.\",\n  \"engines\": {\n    \"node\": \">=20\"\n  },\n  \"scripts\": {\n    \"prepare\": \"node template/scripts/setup-hooks.mjs\",\n    \"test\": \"node template/scripts/test/run.mjs && node template/scripts/check/template-sync.mjs --skip scripts/\",\n    \"check:size\": \"node template/scripts/check/pr-size.mjs\",\n    \"test:windows\": \"powershell -NoProfile -ExecutionPolicy Bypass -File template/scripts/test-windows.ps1\"\n  }\n}\n"},{"file":"template/scripts/check/commit-format.mjs","category":"module","language":"JavaScript","caption":"A key JavaScript module. BEST-OF-AI-DEV template v1. Commit message rules, shared by the commit-msg hook and CI. Format: Conventional Commits. \"type(scope)!: subject\", at most 72 characters. Type and scope are lowercase: \"fix(api/auth): ..\",… It defines `TYPES`, `MAX_SUBJECT`, `EXEMPT`, `PR_EXEMPT` and 4 more.","code":"// BEST-OF-AI-DEV template v1. Commit message rules, shared by the commit-msg hook and CI.\n// Format: Conventional Commits. \"type(scope)!: subject\", at most 72 characters.\n// Type and scope are lowercase: \"fix(api/auth): ...\", not \"Fix(API): ...\".\n// Link issues with a \"Refs: #12\" footer. Closing keywords are banned: issues close on\n// human acceptance, not on merge (RULES.md R7).\n\nexport const TYPES = ['feat', 'fix', 'docs', 'test', 'refactor', 'perf', 'build', 'ci', 'chore', 'revert', 'style'];\nexport const MAX_SUBJECT = 72;\n\nconst SUBJECT = new RegExp(`^(${TYPES.join('|')})(\\\\([a-z0-9][a-z0-9._/-]*\\\\))?!?: \\\\S`);\n// Local hook: git's own merge, revert and autosquash subjects are fine while you work.\nexport const EXEMPT = /^(Merge |Revert \"|fixup! |squash! |amend! )/;\n// PR gate: only reverts. A fixup! or \"Merge ...\" commit reaching main means history\n// was not cleaned up (real merge commits are excluded by --no-merges, not by subject).\nexport const PR_EXEMPT = /^Revert \"/;\n// \"closes #12\", \"Fixed owner/repo#3\", \"resolves https://github.com/o/r/issues/4\"\nexport const CLOSING = /\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\b:?\\s+(#\\d+|[\\w.-]+\\/[\\w.-]+#\\d+|https?:\\/\\/\\S+\\/issues\\/\\d+)/i;\nconst SCISSORS = /^# -+ >8 -+$/;\n\n/**\n * Removes git comment lines and everything below the scissors line.\n * Git's own comments are \"# text\" or a bare \"#\", so only those are dropped. A line like\n * \"#12 add x\" (from `git commit -m`, which keeps it) stays and fails the format check\n * with a real reason instead of vanishing. A leading BOM is removed: Windows\n * PowerShell 5.1 writes one with `-Encoding UTF8` (`Set-Content`, `Out-File`), and so do\n * some editors.\n */\nexport function cleanMessage(raw, commentChar = '#') {\n  const lines = [];\n  const c = commentChar && commentChar !== 'auto' ? commentChar : '#';\n  for (const line of raw.replace(/^\\uFEFF/, '').replace(/\\r/g, '').split('\\n')) {\n    if (SCISSORS.test(line)) break;\n    if (line === c || line.startsWith(`${c} `) || line.startsWith(`${c}\\t`)) continue;\n    lines.push(line);\n  }\n  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();\n  while (lines.length && lines[0].trim() === '') lines.shift();\n  return lines;\n}\n\n/** Returns a list of problems; empty means the subject is valid. */\nexport function checkSubject(subject, exempt = EXEMPT) {\n  if (exempt.test(subject)) return [];\n  const problems = [];\n  if (!SUBJECT.test(subject)) {\n    if (SUBJECT.test(subject.replace(/^[^:]*/, (head) => head.toLowerCase()))) {\n      problems.push('type and scope must be lowercase, e.g. \"fix(api): ...\"');\n    } else if (/^#\\d+\\b/.test(subject)) {\n      problems.push('subject must start with the type, not the issue number: \"fix(x): summary\", then a \"Refs: #N\" footer');\n    } else {\n      problems.push(`subject must look like \"type(scope): summary\" with type one of: ${TYPES.join(', ')}`);\n    }\n  }\n  if (subject.length > MAX_SUBJECT) problems.push(`subject is ${subject.length} characters; the limit is ${MAX_SUBJECT}`);\n  if (/\\.\\s*$/.test(subject)) problems.push('subject must not end with a period');\n  if (CLOSING.test(subject)) problems.push('no closing keywords (closes/fixes/resolves #N); use a \"Refs: #N\" footer');\n  return problems;\n}\n\n/** Checks a whole commit message as git writes it to COMMIT_EDITMSG. */\nexport function checkMessage(raw, commentChar = '#', exempt = EXEMPT) {\n  const lines = cleanMessage(raw, commentChar);\n  if (lines.length === 0) return ['empty commit message'];\n  const [subject, second, ...body] = lines;\n  if (exempt.test(subject)) return [];\n  const problems = checkSubject(subject, exempt);\n  if (second !== undefined && second.trim() !== '') problems.push('leave one blank line between the subject and the body');\n  if (body.some((l) => CLOSING.test(l))) problems.push('no closing keywords in the body; use a \"Refs: #N\" footer');\n  return problems;\n}\n"},{"file":"site/src/components/ThemeToggle.tsx","category":"module","language":"React TSX","caption":"A key React TSX module. It defines `THEME_KEY`, `THEME_SCRIPT` and `ThemeToggle`. Uses `react` and `lucide-react`.","code":"\"use client\";\n\nimport { useSyncExternalStore } from \"react\";\nimport { Moon, Sun } from \"lucide-react\";\n\nexport const THEME_KEY = \"bod-theme\";\n\n/** Sets html[data-theme] before first paint. Dark unless the reader chose light. */\nexport const THEME_SCRIPT = `try{document.documentElement.dataset.theme=localStorage.getItem(\"${THEME_KEY}\")===\"light\"?\"light\":\"dark\"}catch(e){}`;\n\ntype Theme = \"dark\" | \"light\";\n\nconst getTheme = (): Theme => (document.documentElement.dataset.theme === \"light\" ? \"light\" : \"dark\");\n\nfunction subscribe(onChange: () => void) {\n  const observer = new MutationObserver(onChange);\n  observer.observe(document.documentElement, { attributes: true, attributeFilter: [\"data-theme\"] });\n  return () => observer.disconnect();\n}\n\nexport function ThemeToggle() {\n  const theme = useSyncExternalStore(subscribe, getTheme, () => \"dark\" as Theme);\n  const next: Theme = theme === \"dark\" ? \"light\" : \"dark\";\n  return (\n    \u003cbutton\n      type=\"button\"\n      className=\"bd-icon-btn\"\n      aria-label={`Switch to ${next} theme`}\n      title={`Switch to ${next} theme`}\n      onClick={() => {\n        document.documentElement.dataset.theme = next;\n        try {\n          localStorage.setItem(THEME_KEY, next);\n        } catch {}\n      }}\n    >\n      {theme === \"dark\" ? \u003cSun size={16} /> : \u003cMoon size={16} />}\n    \u003c/button>\n  );\n}\n"},{"file":"template/scripts/lib/git-env.mjs","category":"module","language":"JavaScript","caption":"A key JavaScript module. BEST-OF-AI-DEV template v1. Environment hygiene for anything that spawns git. Git exports GITDIR, GITINDEXFILE, GITWORKTREE and friends to hooks. A hook in a linked worktree gets GITDIR pointing at that worktree. Any… It defines `withoutGitEnv`.","code":"// BEST-OF-AI-DEV template v1. Environment hygiene for anything that spawns git.\n//\n// Git exports GIT_DIR, GIT_INDEX_FILE, GIT_WORK_TREE and friends to hooks. A hook in a\n// linked worktree gets GIT_DIR pointing at that worktree. Any child that runs git\n// somewhere else (a test's throwaway repo, a build step) silently operates on the REAL\n// repo instead: \"git init\" + \"git config\" set core.bare and user.name on it, and\n// \"git switch\" moves the worktree. Strip them for every child that does not need them.\n// This also drops GIT_SSH_COMMAND, GIT_ASKPASS and GIT_CONFIG_*; a check that needs\n// them must set them itself or be marked gitEnv: true in hooks/run-checks.mjs.\n\n/** A copy of env without any GIT_* variable. */\nexport function withoutGitEnv(env = process.env) {\n  const out = {};\n  for (const [k, v] of Object.entries(env)) {\n    if (!/^GIT_/i.test(k)) out[k] = v;\n  }\n  return out;\n}\n"},{"file":"site/src/lib/site.ts","category":"module","language":"TypeScript","caption":"A key TypeScript module. Shared by server pages and client components, so nothing here may import node modules. It defines `REPO_URL`, `hrefOf`, `sourceOf`, `GROUPS` and 1 more.","code":"// Shared by server pages and client components, so nothing here may import node modules.\n\nexport const REPO_URL = \"https://github.com/mogesjohnson/BEST-OF-AI-DEV\";\nexport const hrefOf = (slug: string) => (slug ? `/why/${slug}/` : \"/\");\nexport const sourceOf = (file: string) => `${REPO_URL}/blob/main/docs/why/${file}`;\n\n/** Group order in the sidebar. A page whose group is not listed goes last. */\nexport const GROUPS = [\"Start here\", \"Change and review\", \"Rules and context\", \"Verification\", \"Operations\"];\n\n/** What the client shell needs for the sidebar: no HTML. */\nexport type NavEntry = { slug: string; title: string; summary: string; group: string };\n"},{"file":".github/workflows/ci.yml","category":"ci","language":"YAML","caption":"CI workflow \"ci\" that runs on `push` and `workflow_dispatch` with job `verify`.","code":"# BEST-OF-AI-DEV template v1. Cheap CI: one Linux job, cancelled when superseded.\n# Do NOT make this workflow a required check: paths-ignore skips it for docs-only PRs,\n# and a skipped required workflow leaves the PR pending forever. Require pr-checks instead.\n# Other OSes run on demand (Actions > ci > Run workflow), not on every push.\nname: ci\n\non:\n  pull_request:\n    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']\n  push:\n    branches: [main]\n    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']\n  workflow_dispatch:\n    inputs:\n      os:\n        description: Runner to test on\n        type: choice\n        options: [ubuntu-latest, windows-latest, macos-latest]\n        default: ubuntu-latest\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: ci-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  verify:\n    runs-on: ${{ inputs.os || 'ubuntu-latest' }}\n    timeout-minutes: 10\n    steps:\n      # Actions are pinned to full commit SHAs; the comment names the release.\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n        with:\n          persist-credentials: false\n      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0\n        with:\n          node-version: 22\n      # REPO-SPECIFIC: the same commands AGENTS.md lists. Keep this the only definition.\n      - run: npm test\n      # /REPO-SPECIFIC\n"}]}</script>
<script>const KW=/^(import|from|export|default|const|let|var|function|return|if|else|for|while|class|new|async|await|def|try|except|catch|finally|throw|raise|with|as|in|of|yield|lambda|pub|fn|struct|impl|use|mod|package|func|type|interface|enum|true|false|null|None|True|False|undefined|this|self|extends|static|public|private|elif|not|and|or|is|match|case|break|continue|switch)$/;
function hl(code,lang){const e=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
if(lang==='Markdown')return code.split('\n').map(l=>/^#{1,6}\s/.test(l)?'<span class=h>'+e(l)+'</span>':/^\s*([-*]|\d+\.)\s/.test(l)?e(l).replace(/^(\s*(?:[-*]|\d+\.))/,'<span class=k>$1</span>'):e(l).replace(/(`[^`]+`)/g,'<span class=s>$1</span>'));
const hash=/^(Python|shell|YAML|TOML|Ruby|Makefile|Dockerfile|text)$/.test(lang);
const re=new RegExp((hash?'(#.*)':'(\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\/)')+'|("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)|(\\b\\d[\\d_.]*\\b)|([A-Za-z_$][\\w$]*)(?=\\s*\\()|([A-Za-z_$][\\w$]*)','g');
const W=(k,t)=>e(t).split('\n').map(x=>'<span class='+k+'>'+x+'</span>').join('\n');let out='',last=0;code.replace(re,(m,c,s,n,f,w,i)=>{out+=e(code.slice(last,i));last=i+m.length;
out+=c?W('c',c):s?W('s',s):n?'<span class=n>'+n+'</span>':f?(KW.test(f)?'<span class=k>'+f+'</span>':'<span class=f>'+f+'</span>'):KW.test(w)?'<span class=k>'+w+'</span>':w;return m});
out+=e(code.slice(last));return out.split('\n')}
const T=JSON.parse(document.getElementById('data').textContent);let i=0;const $=s=>document.querySelector(s);
const L={"overview":"Overview","agent":"Agent file","config":"Config","entry":"Entry point","module":"Key module","ci":"CI","docs":"Docs"};
$('#steps').innerHTML=T.steps.map((s,n)=>'<li><button data-n='+n+'><small>'+(n+1)+'. '+(L[s.category]||s.category)+'</small>'+s.file.replace(/[&<]/g,c=>c=='&'?'&amp;':'&lt;')+'</button></li>').join('');
function go(n){i=Math.max(0,Math.min(T.steps.length-1,n));const s=T.steps[i];$('.path').textContent=s.file;$('.badge').textContent=L[s.category]||s.category;
$('.caption').innerHTML=s.caption.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
$('pre').innerHTML=hl(s.code,s.language).map(l=>'<span class=l>'+(l||' ')+'</span>').join('');$('pre').scrollTop=0;
$('#count').textContent=(i+1)+' / '+T.steps.length;$('.bar i').style.width=((i+1)/T.steps.length*100)+'%';
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.n==i));history.replaceState(null,'','#'+(i+1))}
$('#steps').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.n)};$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));window.tour={go,count:T.steps.length};go((parseInt(location.hash.slice(1))||1)-1);
const ap=new URLSearchParams(location.search).get('autoplay');if(ap){setInterval(()=>go(i+1<T.steps.length?i+1:0),(+ap||5)*1000)}</script></body></html>
